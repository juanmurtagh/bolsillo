<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Bolsillo</title>
<meta name="theme-color" content="#F4EFE2">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">

<!-- Librería oficial de Supabase: le da a la página las funciones para hablar con la base de datos -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
/* ============ COLORES Y TIPOGRAFÍAS ============
   Todos los colores están definidos acá una sola vez como "variables" (--nombre).
   El resto del código las usa, así que para cambiar un color alcanza con tocarlo acá. */
:root{
  --bg:#F4EFE2; --surface:#FFFCF4; --soft:#EBE4D2; --ink:#1F2A22; --muted:#6A6656; --line:#E2D9C3;
  --accent:#2E6B48; --accent-ink:#FFFCF4; --danger:#B03A2E;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300; --s6:#6250d6; --s7:#e34948;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
/* Modo oscuro: si el celular o la compu están en modo oscuro, se usan estos colores */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0C0B; --surface:#121614; --soft:#1E2622; --ink:#EFEADB; --muted:#9FA59F; --line:#222A25;
  --accent:#4CC383; --accent-ink:#06150D; --danger:#F08A80;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#2f9a2f; --s6:#9085e9; --s7:#e66767;
  color-scheme:dark}}
/* Modo oscuro elegido a mano con el botón (mismos colores que arriba) */
:root[data-theme="dark"]{
  --bg:#0A0C0B; --surface:#121614; --soft:#1E2622; --ink:#EFEADB; --muted:#9FA59F; --line:#222A25;
  --accent:#4CC383; --accent-ink:#06150D; --danger:#F08A80;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#2f9a2f; --s6:#9085e9; --s7:#e66767;
  color-scheme:dark}
/* Botón de apariencia: Auto / Claro / Oscuro */
.tema{display:inline-flex;align-self:center;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.tema button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tema button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pie-app{display:flex;justify-content:center;padding-top:8px}

/* Sin zoom: el celular no agranda la pantalla al tocar un campo ni con doble toque */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ============ ENCABEZADO ============ */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:24px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.salir{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;margin-left:8px;letter-spacing:0;text-transform:none}
.mes{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.mes button{width:34px;height:34px;border-radius:999px;border:0;background:transparent;font-size:18px;line-height:1}
.mes button:hover:not(:disabled){background:var(--soft)}
.mes button:disabled{opacity:.3;cursor:default}
.mes span{min-width:128px;text-align:center;font-weight:600;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* ============ RESUMEN: TORTA + LISTA ============ */
.resumen{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:520px){.resumen{grid-template-columns:minmax(0,1fr)}.dona{justify-self:center}}
.dona{position:relative;width:200px;height:200px}
.dona svg{width:100%;height:100%;transform:rotate(-90deg)}
.dona circle{fill:none;transition:stroke-width .15s}
.dona .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dona .centro small{font-size:12px;color:var(--muted)}
.dona .centro strong{font-family:var(--display);font-weight:700;font-size:24px}
.filas{display:flex;flex-direction:column;gap:2px;min-width:0}
.fila{display:grid;grid-template-columns:12px minmax(0,1fr) auto 40px 14px;gap:10px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-radius:8px;padding:9px 8px}
.fila:hover,.fila.on{background:var(--soft)}
.fila .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.fila .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fila .nom small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.fila .monto{font-weight:600}
.fila .pct{color:var(--muted);text-align:right;font-size:13px}
.fila .chev{color:var(--muted)}
.fila.cero{opacity:.6}
.nueva{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.nueva input{flex:1;min-width:0}

/* ============ FORMULARIOS Y BOTONES ============ */
input[type=text],input[type=email],input[type=password],input[type=date],input[inputmode],select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dan{color:var(--danger)}
.btn.chico{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--muted)}
.err{font-size:13px;color:var(--danger);margin:0}

/* ============ LISTA DE GASTOS ============ */
.gastos{display:flex;flex-direction:column}
.gasto{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.gasto:first-child{border-top:0}
.fecha{text-align:center;line-height:1.1}
.fecha b{display:block;font-family:var(--display);font-size:20px}
.fecha small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gasto .txt{min-width:0}
.gasto .txt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gasto .txt small{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.gasto .txt small i{width:8px;height:8px;border-radius:2px;background:var(--c);display:inline-block}
.gasto .monto{font-weight:600}
.acc{display:flex;gap:2px}
.ico{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}
.ico:hover{background:var(--soft);color:var(--ink)}
.ico svg{width:17px;height:17px}
.confirma{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;background:var(--soft);border-radius:8px;padding:8px 10px}
.confirma span{flex:1;min-width:140px}

/* ============ VISTA DE UNA CATEGORÍA ============ */
.volver{align-self:flex-start;background:transparent;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.cab{display:flex;flex-direction:column;gap:12px}
.cab .t{display:flex;align-items:center;gap:10px}
.cab .t i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.cab h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;min-width:0;overflow-wrap:anywhere}
.cab .tot{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.cab .botones{display:flex;gap:8px;flex-wrap:wrap}
.colores{display:flex;gap:10px;flex-wrap:wrap}
.color{width:30px;height:30px;border-radius:50%;border:0;padding:0;background:var(--c);box-shadow:0 0 0 2px var(--surface)}
.color.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.color:hover:not(.on){transform:scale(1.1)}
.vacio{text-align:center;color:var(--muted);padding:12px 0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px dashed var(--line);background:transparent;font-weight:500}
.chip:hover{border-style:solid;background:var(--soft)}

/* ============ BUSCADOR ============ */
.busqueda{position:relative}
.busqueda svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.busqueda input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px 0 42px}
.busqueda input:focus{border-color:var(--accent);outline:none}
.grupo{display:flex;justify-content:space-between;margin:14px 0 2px}

/* ============ ANIMACIÓN AL GUARDAR ============ */
.festejo{position:fixed;left:50%;top:40%;width:96px;height:96px;margin-left:-48px;pointer-events:none;z-index:30;animation:desvanecer .3s 1.05s forwards}
.festejo svg{width:100%;height:100%;overflow:visible}
.festejo g{transform-box:fill-box;transform-origin:50% 100%}
.festejo .moneda{animation:caer .5s cubic-bezier(.55,0,.8,.3) both}
.festejo .billetera{animation:rebote .4s .45s ease-out both}
@keyframes caer{from{transform:translateY(-70px);opacity:0}30%{opacity:1}to{transform:translateY(0)}}
@keyframes rebote{0%{transform:scale(1)}35%{transform:scale(1.12,.88)}70%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes desvanecer{to{opacity:0;transform:scale(.9)}}

/* ============ CALENDARIO ============ */
.pestanas{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.pestanas button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.pestanas button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cal{display:flex;flex-direction:column;gap:12px}
.cal-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cal-cab b{font-family:var(--display);font-size:22px}
.semana,.grilla{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.semana span{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.dia{aspect-ratio:1/1.05;min-width:0;padding:0;border:1.5px solid transparent;border-radius:9px;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:color-mix(in srgb, var(--accent) calc(var(--nivel, 0) * 100%), transparent)}
.dia small{font-size:10px;font-weight:600;line-height:1}
.dia.fuerte{color:var(--accent-ink)}
.dia.hoy b{text-decoration:underline;text-underline-offset:3px}
.dia:disabled{opacity:.3;cursor:default}
.dia:not(:disabled):hover{border-color:var(--line)}
.dia.sel,.dia.sel:hover{border-color:var(--ink)}
.det{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.det-cab{display:flex;justify-content:space-between;gap:12px}
.det .fecha{display:none}
.det .gasto{grid-template-columns:minmax(0,1fr) auto auto}
#main{width:100%}

/* ============ PANTALLA DE INGRESO ============ */
.login{max-width:400px;margin:10vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .portada{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:8px}
.login h1{font-size:40px}
.login .frase{margin:0;color:var(--muted);font-size:15px;max-width:30ch;text-wrap:balance}
.logo-login{width:88px;height:88px;border-radius:22px}
.login .btn.pri{width:100%;height:48px;margin-top:4px}
.pass{position:relative}
.pass input{padding-right:84px}
.ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--accent);font-weight:600;font-size:13px}
.ver:hover{background:var(--soft)}
.separador{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-top:6px}
.separador::before,.separador::after{content:'';flex:1;height:1px;background:var(--line)}
.btn.grande{width:100%;height:48px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font-size:16px}
.btn.grande:hover{background:var(--soft)}

/* ============ PANTALLA DE BIENVENIDA (la billetera que recibe la moneda) ============ */
.splash{position:fixed;inset:0;z-index:100;background:#316C4B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease}
.splash.fuera{opacity:0;pointer-events:none}
.splash svg{width:150px;height:150px;overflow:visible}
.splash g{transform-box:fill-box;transform-origin:50% 100%}
.splash .s-moneda{animation:caerSplash .7s .15s cubic-bezier(.55,0,.8,.3) both}
.splash .s-billetera{animation:rebote .45s .8s ease-out both}
.splash h1{color:#FFFCF4;font-size:44px;animation:aparecer .5s 1s both}
@keyframes caerSplash{from{transform:translateY(-120px);opacity:0}25%{opacity:1}to{transform:translateY(0)}}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}}

/* ============ PRESUPUESTO E INGRESOS ============ */
.balance{display:flex;flex-direction:column;gap:12px}
.bal-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bal-num{display:block;font-family:var(--display);font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-.02em}
.bal-num.neg{color:var(--danger)}
.barra{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.barra span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.barra span.alerta{background:var(--danger)}
.bal-filas{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;color:var(--muted)}
.bal-filas b{color:var(--ink);font-weight:600;text-align:right}
.bal-filas b.pos{color:var(--accent)}
.monto.pos{color:var(--accent)}
.link-acc{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px}

/* ============ BOTÓN FIJO Y VENTANA DE CARGA ============ */
.pie{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.pie .btn{width:100%;max-width:620px;height:52px;font-size:16px;border-radius:14px}
.velo{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.hoja{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.velo{align-items:center}.hoja{border-radius:18px}}
.hoja h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.monto-in{font-family:var(--display);font-size:28px!important;height:60px!important;font-weight:700}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hoja .fin{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<!-- ============ PANTALLA DE BIENVENIDA: la moneda cae en la billetera ============ -->
<div id="splash" class="splash" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <g class="s-moneda"><circle cx="50" cy="40" r="14" fill="#E3A11B"/><text x="50" y="46.5" text-anchor="middle" font-size="17" font-weight="700" font-family="sans-serif" fill="#316C4B">$</text></g>
    <g class="s-billetera"><rect x="16" y="46" width="62" height="36" rx="10" fill="#FFFCF4"/>
      <rect x="62" y="55.5" width="24" height="17" rx="8.5" fill="#FFFCF4" stroke="#316C4B" stroke-width="3"/>
      <circle cx="72" cy="64" r="3" fill="#316C4B"/></g>
  </svg>
  <h1>Bolsillo</h1>
</div>

<!-- ============ PANTALLA DE INGRESO (se muestra si no iniciaste sesión) ============ -->
<form id="login" class="login" hidden novalidate>
  <div class="portada">
    <img src="logo.png" alt="Logo de Bolsillo" class="logo-login">
    <h1>Bolsillo</h1>
    <p class="frase">Para que fin de mes no te agarre por sorpresa.</p>
  </div>
  <div class="campo"><label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="email" placeholder="tu@email.com"></div>
  <div class="campo"><label for="lPass">Contraseña</label>
    <div class="pass"><input type="password" id="lPass" autocomplete="current-password"><button type="button" class="ver" id="lVer">Mostrar</button></div>
  </div>
  <p class="err" id="lErr" hidden></p>
  <button type="submit" class="btn pri" id="lEntrar">Entrar</button>
  <div class="separador"><span id="lPregunta">¿No tenés cuenta?</span></div>
  <button type="button" class="btn grande" id="lCambiar">Crear cuenta nueva</button>
  <div class="tema" role="group" aria-label="Apariencia"><button type="button" data-tema="auto">Auto</button><button type="button" data-tema="claro">Claro</button><button type="button" data-tema="oscuro">Oscuro</button></div>
</form>

<!-- ============ LA APLICACIÓN (se muestra una vez que entraste) ============ -->
<div id="app" class="wrap" hidden>
  <header class="top">
    <div>
      <p class="eyebrow">Mis gastos <button class="salir" id="btnSalir">Cerrar sesión</button></p>
      <h1>Bolsillo</h1>
    </div>
    <div class="mes" aria-label="Mes">
      <button id="mesAnt" aria-label="Mes anterior">‹</button>
      <span id="mesTxt" class="num">…</span>
      <button id="mesSig" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  <div class="busqueda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" id="buscar" placeholder="Buscar gastos (ej: SUBE, cena)" aria-label="Buscar gastos" autocomplete="off">
  </div>
  <main id="main" class="wrap"></main>
  <footer class="pie-app"><div class="tema" role="group" aria-label="Apariencia"><button type="button" data-tema="auto">Auto</button><button type="button" data-tema="claro">Claro</button><button type="button" data-tema="oscuro">Oscuro</button></div></footer>
</div>

<div class="pie" id="pie" hidden><button id="btnAgregar" class="btn pri">+ Agregar gasto</button></div>
<div id="velo" class="velo" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* =====================================================================
   1. CONEXIÓN CON SUPABASE
   Estos dos datos le dicen a la página CON QUÉ base de datos hablar.

  cats: {},          // categorías:  { id: {nombre, color, creado} }
  gastos: {},        // gastos:      { id: {monto, cat, fecha, desc, creado} }
  ingresos: {},      // ingresos:    { id: {monto, fecha, desc, creado} }

/* =====================================================================
   3. FUNCIONES DE AYUDA (fechas, plata, textos)
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
const plata = v => '$' + nf.format(Math.round(v*100)/100);
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mesDe(f){ return f.slice(0,7); }
function nombreMes(m){ const [y,mm]=m.split('-').map(Number); const t=new Date(y,mm-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1).replace(' de ',' '); }
function soloMes(m){ const [y,mm]=m.split('-').map(Number); return new Date(y,mm-1,1).toLocaleDateString('es-AR',{month:'long'}); }
function moverMes(m,d){ let [y,mm]=m.split('-').map(Number); mm+=d; while(mm<1){mm+=12;y--} while(mm>12){mm-=12;y++} return y+'-'+String(mm).padStart(2,'0'); }
function nuevoId(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}); }
// Entiende montos escritos a la argentina: 2500, 2.500 o 2.500,50
function parseMonto(t){ t=String(t).replace(/[$\s]/g,''); if(!t) return NaN;
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  const n=Number(t); return isFinite(n) ? Math.round(n*100)/100 : NaN; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2400); }

/* =====================================================================
   4. BASE DE DATOS: leer y guardar en Supabase
   Cada función hace un pedido a Supabase y, si sale bien,
   actualiza el estado y vuelve a dibujar la página.
   ===================================================================== */
const db = {
  async cargar(){
    const [c, g, ing, pr] = await Promise.all([
      sb.from('categorias').select('id,nombre,color,creado'),
      sb.from('gastos').select('id,categoria_id,monto,fecha,descripcion,creado'),
      sb.from('ingresos').select('id,monto,fecha,descripcion,creado'),
      sb.from('presupuestos').select('mes,monto')
    ]);
    if (c.error || g.error) throw (c.error || g.error);
    if (ing.error || pr.error) throw (ing.error || pr.error);
    S.ingresos = Object.fromEntries(ing.data.map(r => [r.id, {monto:Number(r.monto), fecha:r.fecha, desc:r.descripcion||'', creado:Date.parse(r.creado)}]));
    S.presu = Object.fromEntries(pr.data.map(r => [r.mes, Number(r.monto)]));
    S.cats = Object.fromEntries(c.data.map(r => [r.id, {nombre:r.nombre, color:r.color, creado:Date.parse(r.creado)}]));
    S.gastos = Object.fromEntries(g.data.map(r => [r.id, {monto:Number(r.monto), cat:r.categoria_id, fecha:r.fecha, desc:r.descripcion||'', creado:Date.parse(r.creado)}]));
    S.listo = true; render();
  },
  async guardarCat(id, obj){
    const { error } = await sb.from('categorias').upsert({id, nombre:obj.nombre, color:obj.color});
    if (error) throw error;
    S.cats[id] = obj; render();
  },
  async guardarGasto(id, obj){
    const { error } = await sb.from('gastos').upsert({id, categoria_id:obj.cat, monto:obj.monto, fecha:obj.fecha, descripcion:obj.desc||null});
    if (error) throw error;
    S.gastos[id] = obj; render();
  },
  async guardarIngreso(id, obj){
    const { error } = await sb.from('ingresos').upsert({id, monto:obj.monto, fecha:obj.fecha, descripcion:obj.desc||null});
    if (error) throw error;
    S.ingresos[id] = obj; render();
  },
  async borrarIngreso(id){
    const { error } = await sb.from('ingresos').delete().eq('id', id);
    if (error) throw error;
    delete S.ingresos[id]; render();
  },
  async guardarPresu(mes, monto){
    const { error } = await sb.from('presupuestos').upsert({mes, monto});
    if (error) throw error;
    S.presu[mes] = monto; render();
  },
  async borrarGasto(id){
    const { error } = await sb.from('gastos').delete().eq('id', id);
    if (error) throw error;
    delete S.gastos[id]; render();
  },
  async borrarCat(id){
    // Al borrar la categoría, Supabase borra solo sus gastos (on delete cascade)
    const { error } = await sb.from('categorias').delete().eq('id', id);
    if (error) throw error;
    for (const [gid,g] of Object.entries(S.gastos)) if (g.cat === id) delete S.gastos[gid];
    delete S.cats[id]; render();
  }
};
// Envuelve cada guardado: si falla, avisa en vez de romperse en silencio
async function seguro(fn, ok){
  try { await fn(); if (ok) toast(ok); }
  catch(e){ console.error(e); toast('No se pudo guardar. Revisá tu conexión y probá de nuevo.'); }
}

function colorLibre(){ const usados=Object.values(S.cats).map(c=>c.color); for(let i=0;i<8;i++) if(!usados.includes(i)) return i; return Object.keys(S.cats).length%8; }
async function crearCat(nombre){
  nombre = nombre.trim().replace(/\s+/g,' '); if(!nombre) return null;
  const ya = Object.entries(S.cats).find(([,c]) => c.nombre.toLowerCase() === nombre.toLowerCase());
  if (ya) return ya[0];
  const id = nuevoId();
  await db.guardarCat(id, {nombre, color:colorLibre(), creado:Date.now()});
  return id;
}

/* =====================================================================
   5. CÁLCULOS DEL MES
   ===================================================================== */
function delMes(){
  return Object.entries(S.gastos).filter(([,g]) => mesDe(g.fecha) === S.mes).map(([id,g]) => ({id,...g}))
    .sort((a,b) => b.fecha.localeCompare(a.fecha) || (b.creado||0)-(a.creado||0));
}
function resumen(){
  const gs = delMes(); const t = {};
  gs.forEach(g => { t[g.cat] = t[g.cat] || {m:0,n:0}; t[g.cat].m += g.monto; t[g.cat].n++; });
  const filas = Object.entries(S.cats).map(([id,c]) => ({id,...c, m:t[id]?.m||0, n:t[id]?.n||0}))
    .sort((a,b) => b.m-a.m || a.nombre.localeCompare(b.nombre,'es'));
  return { gs, filas, total: filas.reduce((s,f) => s+f.m, 0) };
}

// La torta: un círculo por categoría, cada uno dibuja solo "su" pedazo
function dona(filas, total){
  const R=80, C=2*Math.PI*R, gap=filas.filter(f=>f.m>0).length>1?3:0; let off=0;
  let arcos = `<circle cx="100" cy="100" r="${R}" stroke="var(--soft)" stroke-width="26"/>`;
  if (total > 0) filas.forEach((f,i) => { if(!f.m) return; const L=f.m/total*C;
    arcos += `<circle data-i="${i}" cx="100" cy="100" r="${R}" style="stroke:var(--s${f.color})" stroke-width="${S.on===i?34:26}" stroke-dasharray="${Math.max(L-gap,0.5)} ${C}" stroke-dashoffset="${-off}"/>`; off+=L; });
  const sel = S.on>=0 && filas[S.on];
  return `<div class="dona"><svg viewBox="0 0 200 200" role="img" aria-label="Gastos de ${esc(nombreMes(S.mes))} por categoría">${arcos}</svg>
    <div class="centro"><small>${sel?esc(sel.nombre):'Total de '+esc(soloMes(S.mes))}</small><strong class="num">${plata(sel?sel.m:total)}</strong></div></div>`;
}

  const conf = S.confirma==='g:'+g.id ? `<div class="confirma"><span>¿Borrar este gasto de ${plata(g.monto)}?</span>

function render(){

  $('#mesSig').disabled = S.mes >= mesDe(hoy());
  const m = $('#main');
  if (!S.listo){ m.innerHTML='<div class="card"><p class="vacio">Cargando tus gastos…</p></div>'; return; }
  if (S.vista!=='inicio' && !S.cats[S.vista]) S.vista='inicio';
  $('#btnAgregar').textContent = S.vista==='inicio' ? '+ Agregar gasto o ingreso' : '+ Agregar gasto en '+S.cats[S.vista].nombre;
  if (S.busca && S.busca.trim()){ m.innerHTML = vistaBusqueda(); return; }

// El presupuesto del mes: si no lo cargaste, se usa el último que pusiste
function presupuestoDe(mes){
  if (S.presu[mes] != null) return { monto:S.presu[mes], heredado:false };
  const ant = Object.keys(S.presu).filter(m => m < mes).sort().pop();
  return ant ? { monto:S.presu[ant], heredado:true, desde:ant } : null;
}
const ingresosDelMes = () => Object.entries(S.ingresos).filter(([,i]) => mesDe(i.fecha) === S.mes).map(([id,i]) => ({id,...i}))
  .sort((a,b) => b.fecha.localeCompare(a.fecha) || (b.creado||0)-(a.creado||0));
// La tarjeta de arriba: presupuesto + ingresos − gastos = lo que te queda
function tarjetaBalance(){
  const p = presupuestoDe(S.mes), ings = ingresosDelMes();
  const ing = ings.reduce((s,i) => s + i.monto, 0), gas = delMes().reduce((s,g) => s + g.monto, 0);
  if (!p && !ing) return `<section class="card balance"><div class="bal-cab"><div style="flex:1;min-width:200px"><p class="eyebrow">Presupuesto de ${esc(soloMes(S.mes))}</p>
      <p style="margin:6px 0 0">Anotá con cuánta plata arrancás el mes, y te mostramos cuánto te queda a medida que gastás.</p></div>
      <button class="btn pri" data-a="presu">Poner presupuesto</button></div></section>`;
  const base = (p ? p.monto : 0) + ing, disp = base - gas;
  const pct = base > 0 ? Math.min(100, gas / base * 100) : 100;
  return `<section class="card balance">
    <div class="bal-cab"><div><p class="eyebrow">Te queda en ${esc(soloMes(S.mes))}</p><b class="bal-num num${disp < 0 ? ' neg' : ''}">${disp < 0 ? '−' : ''}${plata(Math.abs(disp))}</b></div>
      <button class="link-acc" data-a="presu">Editar presupuesto</button></div>
    <div class="barra" role="img" aria-label="Gastaste el ${Math.round(pct)}% de lo disponible"><span class="${pct >= 90 ? 'alerta' : ''}" style="width:${pct}%"></span></div>
    <div class="bal-filas num">
      <span>Presupuesto${p && p.heredado ? ` <small>(el mismo que en ${esc(soloMes(p.desde))})</small>` : ''}</span><b>${plata(p ? p.monto : 0)}</b>
      <span>+ Ingresos</span><b class="pos">${plata(ing)}</b>
      <span>− Gastos</span><b>${plata(gas)}</b>
    </div></section>`;
}

function seccionIngresos(){

}

  return tarjetaBalance() + `<section class="card"><div class="resumen">${dona(filas,total)}<div class="filas">${lista}</div></div>

      ${gs.length>8?'<p class="vacio" style="font-size:13px">Tocá una categoría para ver todos sus gastos.</p>':''}</section>` + seccionIngresos();

// Buscador: encuentra gastos de todos los meses por descripción o categoría
const sinTildes = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function vistaBusqueda(){
  const q = sinTildes(S.busca.trim());
  const res = Object.entries(S.gastos).map(([id, g]) => ({id, ...g}))
    .filter(g => sinTildes(g.desc).includes(q) || sinTildes(S.cats[g.cat]?.nombre).includes(q))
    .sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.creado||0) - (a.creado||0));
  if (!res.length) return `<section class="card"><p class="vacio">No encontramos gastos con "${esc(S.busca.trim())}".</p></section>`;
  const total = res.reduce((s, g) => s + g.monto, 0);
  // Agrupar los resultados por mes, con el subtotal de cada uno
  let html = '', mesActual = '';
  res.forEach(g => {
    const mes = mesDe(g.fecha);
    if (mes !== mesActual){
      mesActual = mes;
      const sub = res.filter(x => mesDe(x.fecha) === mes).reduce((s, x) => s + x.monto, 0);
      html += `<p class="eyebrow grupo"><span>${esc(nombreMes(mes))}</span><span class="num">${plata(sub)}</span></p>`;
    }
    html += filaGasto(g, true);
  });
  return `<section class="card"><div class="cal-cab"><span class="eyebrow">${res.length} ${res.length===1?'gasto encontrado':'gastos encontrados'}</span><b class="num">${plata(total)}</b></div>
    <div class="gastos">${html}</div></section>`;
}

/* =====================================================================
   6b. CALENDARIO DEL MES
   ===================================================================== */
// Pestañas de arriba: "Resumen" (la torta) o "Calendario"
function pestanas(){
  const cal = S.pestana === 'calendario';
  return `<div class="pestanas" role="tablist">
    <button role="tab" aria-selected="${!cal}" class="${cal?'':'on'}" data-a="pestana" data-p="resumen">Resumen</button>
    <button role="tab" aria-selected="${cal}" class="${cal?'on':''}" data-a="pestana" data-p="calendario">Calendario</button></div>`;
}
// Montos cortos para que entren en cada día: 7800 -> $7,8k
const nf1 = new Intl.NumberFormat('es-AR', {maximumFractionDigits:1});
function corto(v){ return v >= 1e6 ? '$'+nf1.format(v/1e6)+'M' : v >= 1000 ? '$'+nf1.format(v/1000)+'k' : '$'+Math.round(v); }

function vistaCalendario(){
  const [y, m] = S.mes.split('-').map(Number);
  const diasDelMes = new Date(y, m, 0).getDate();
  const huecos = (new Date(y, m-1, 1).getDay() + 6) % 7;   // cuántos días vacíos antes del 1 (la semana arranca el lunes)
  const hoyF = hoy();
  // Agrupar los gastos del mes por fecha
  const porDia = {};
  delMes().forEach(g => { (porDia[g.fecha] = porDia[g.fecha] || []).push(g); });
  const totalDia = f => (porDia[f] || []).reduce((s, g) => s + g.monto, 0);
  const maximo = Math.max(0, ...Object.keys(porDia).map(totalDia));
  const totalMes = Object.keys(porDia).reduce((s, f) => s + totalDia(f), 0);
  // Día elegido: si no hay uno de este mes, se elige hoy (o ninguno si es otro mes)
  if (!S.diaSel || mesDe(S.diaSel) !== S.mes) S.diaSel = S.mes === mesDe(hoyF) ? hoyF : null;

  let celdas = '<span></span>'.repeat(huecos);
  for (let d = 1; d <= diasDelMes; d++){
    const f = S.mes + '-' + String(d).padStart(2,'0');
    const t = totalDia(f);
    const nivel = t ? 0.15 + 0.6 * t / maximo : 0;   // más gasto = verde más intenso
    const clases = ['dia', f===S.diaSel?'sel':'', f===hoyF?'hoy':'', nivel>0.5?'fuerte':''].join(' ');
    celdas += `<button class="${clases}" data-a="dia" data-f="${f}" ${f>hoyF?'disabled':''} style="--nivel:${nivel.toFixed(2)}" aria-label="${d}: ${plata(t)}"><b>${d}</b>${t?`<small class="num">${corto(t)}</small>`:''}</button>`;
  }

  let detalle = '<p class="vacio">Tocá un día para ver sus gastos.</p>';
  if (S.diaSel){
    const gs = porDia[S.diaSel] || [];
    let titulo = new Date(S.diaSel+'T12:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'}).replace(',', '');
    titulo = S.diaSel === hoyF ? 'Hoy, ' + titulo : titulo.charAt(0).toUpperCase() + titulo.slice(1);
    detalle = `<div class="det-cab"><b>${esc(titulo)}</b><b class="num">${plata(totalDia(S.diaSel))}</b></div>
      ${gs.length ? `<div class="gastos">${gs.map(g => filaGasto(g, true)).join('')}</div>` : '<p class="vacio">No gastaste nada este día.</p>'}
      <button class="btn chico" data-a="agregarDia" data-f="${S.diaSel}" style="align-self:center">+ Agregar gasto en este día</button>`;
  }
  return `<section class="card cal">
    <div class="cal-cab"><span class="eyebrow">Total de ${esc(soloMes(S.mes))}</span><b class="num">${plata(totalMes)}</b></div>
    <div class="semana"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grilla">${celdas}</div>
    <div class="det">${detalle}</div></section>`;
}

/* =====================================================================
   7. VENTANA PARA CARGAR O EDITAR UN GASTO
   ===================================================================== */
let tipoHoja = 'gasto';   // 'gasto' o 'ingreso': qué estás cargando en la ventana
function abrirHoja(gid, fechaElegida, opciones = {}){
  const g = gid ? S.gastos[gid] : null;
  const ing = opciones.ingreso ? S.ingresos[opciones.ingreso] : null;
  tipoHoja = ing || opciones.tipo === 'ingreso' ? 'ingreso' : 'gasto';
  const catDef = g ? g.cat : (S.vista!=='inicio' ? S.vista : '');
  const fechaDef = g ? g.fecha : ing ? ing.fecha : (fechaElegida || (S.mes===mesDe(hoy()) ? hoy() : S.mes+'-01'));
  const ops = Object.entries(S.cats).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre,'es'))
    .map(([id,c])=>`<option value="${id}"${id===catDef?' selected':''}>${esc(c.nombre)}</option>`).join('');
  const v = $('#velo');
  const editando = g || ing;
  v.innerHTML = `<form class="hoja" data-f="gasto" data-id="${gid||''}" data-ing="${opciones.ingreso||''}" role="dialog" aria-modal="true" aria-labelledby="hTit" novalidate>
    ${editando ? '' : `<div class="pestanas" role="radiogroup" aria-label="Tipo"><button type="button" role="radio" data-tipo="gasto" class="${tipoHoja==='gasto'?'on':''}" aria-checked="${tipoHoja==='gasto'}">Gasto</button><button type="button" role="radio" data-tipo="ingreso" class="${tipoHoja==='ingreso'?'on':''}" aria-checked="${tipoHoja==='ingreso'}">Ingreso</button></div>`}
    <h3 id="hTit">${tituloHoja(editando)}</h3>
    <div class="campo"><label for="fMonto">Monto</label><input id="fMonto" class="monto-in num" inputmode="decimal" autocomplete="off" placeholder="$0" value="${g?esc(nf.format(g.monto)):ing?esc(nf.format(ing.monto)):''}"><p class="err" id="eMonto" hidden></p></div>
    <div class="dos">
      <div class="campo" id="campoCat"${tipoHoja==='ingreso'?' hidden':''}><label for="fCat">Categoría</label><select id="fCat">${catDef?'':'<option value="" selected disabled>Elegí una</option>'}${ops}<option value="__nueva">+ Nueva categoría…</option></select><p class="err" id="eCat" hidden></p></div>
      <div class="campo"><label for="fFecha">Fecha</label><input type="date" id="fFecha" value="${fechaDef}" max="${hoy()}"><p class="err" id="eFecha" hidden></p></div>
    </div>
    <div class="campo" id="campoNueva" hidden><label for="fNueva">Nombre de la nueva categoría</label><input type="text" id="fNueva" maxlength="40" placeholder="Ej: Regalos"></div>
    <div class="campo"><label for="fDesc">Descripción <span style="font-weight:400">(opcional)</span></label><input type="text" id="fDesc" maxlength="80" placeholder="${tipoHoja==='ingreso'?'Ej: sueldo, venta de mates':'Ej: SUBE, cena, libro'}" value="${g?esc(g.desc||''):ing?esc(ing.desc||''):''}"></div>
    <div class="fin"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button type="submit" class="btn pri" id="hGuardar">${botonHojaB(editando)}</button></div>
  </form>`;
  v.hidden = false;
  const sel = $('#fCat');
  sel.onchange = () => { const n = sel.value==='__nueva'; $('#campoNueva').hidden=!n; if(n) $('#fNueva').focus(); $('#eCat').hidden=true; };
  if (!Object.keys(S.cats).length && tipoHoja==='gasto'){ sel.value='__nueva'; $('#campoNueva').hidden=false; }
  ['fMonto','fFecha','fNueva'].forEach(i => $('#'+i).addEventListener('input', () => document.querySelectorAll('.hoja .err').forEach(e=>e.hidden=true)));
  setTimeout(() => $('#fMonto').focus(), 50);
}
function tituloHoja(editando){ return tipoHoja==='ingreso' ? (editando?'Editar ingreso':'Nuevo ingreso') : (editando?'Editar gasto':'Nuevo gasto'); }
function botonHojaB(editando){ return editando ? 'Guardar cambios' : (tipoHoja==='ingreso' ? 'Guardar ingreso' : 'Guardar gasto'); }
// Cambiar entre "Gasto" e "Ingreso" en la ventana
function ponerTipo(t){
  tipoHoja = t;
  document.querySelectorAll('[data-tipo]').forEach(b => { b.classList.toggle('on', b.dataset.tipo === t); b.setAttribute('aria-checked', b.dataset.tipo === t); });
  $('#campoCat').hidden = t === 'ingreso';
  $('#campoNueva').hidden = t === 'ingreso' || $('#fCat').value !== '__nueva';
  $('#hTit').textContent = tituloHoja(false); $('#hGuardar').textContent = botonHojaB(false);
  $('#fDesc').placeholder = t === 'ingreso' ? 'Ej: sueldo, venta de mates' : 'Ej: SUBE, cena, libro';
  document.querySelectorAll('.hoja .err').forEach(e => e.hidden = true);
}
// Repetir: abre la ventana de un gasto nuevo, ya completa con los datos de otro
function repetirGasto(id){
  const g = S.gastos[id];
  abrirHoja(null, hoy());
  $('#fMonto').value = nf.format(g.monto);
  $('#fCat').value = g.cat;
  $('#fDesc').value = g.desc || '';
}
// Animación: una moneda cae en la billetera cuando guardás un gasto
function festejar(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;   // respeta a quien pide menos movimiento
  const el = document.createElement('div');
  el.className = 'festejo';
  el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" style="fill:var(--accent)"/>
    <g class="moneda"><circle cx="50" cy="42" r="13" fill="#E3A11B"/><text x="50" y="48" text-anchor="middle" font-size="16" font-weight="700" font-family="sans-serif" fill="#2E6B48">$</text></g>
    <g class="billetera"><rect x="20" y="47" width="58" height="33" rx="9" fill="#FFFCF4"/>
      <rect x="62" y="56" width="21" height="15" rx="7.5" fill="#FFFCF4" style="stroke:var(--accent)" stroke-width="3"/>
      <circle cx="71" cy="63.5" r="2.6" style="fill:var(--accent)"/></g></svg>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);   // la saca de la pantalla cuando termina
}
function cerrarHoja(){ const v=$('#velo'); v.hidden=true; v.innerHTML=''; }
function error(id,t){ const e=$('#'+id); e.textContent=t; e.hidden=false; }

async function guardarGasto(form){
  const monto=parseMonto($('#fMonto').value), cat=$('#fCat').value, fecha=$('#fFecha').value, desc=$('#fDesc').value.trim();
  if (tipoHoja === 'ingreso'){
    let ok2 = true;
    if (!(monto>0)){ error('eMonto','Escribí un monto mayor a cero, por ejemplo 250000.'); ok2=false; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)){ error('eFecha','Elegí una fecha.'); ok2=false; }
    if (!ok2) return;
    const iid = form.dataset.ing, prev = iid ? S.ingresos[iid] : null;
    cerrarHoja();
    await seguro(async () => {
      await db.guardarIngreso(iid || nuevoId(), {monto, fecha, desc, creado:prev?.creado||Date.now()});
      if (!iid) festejar();
      if (mesDe(fecha) !== S.mes){ S.mes=mesDe(fecha); S.on=-1; render(); }
    }, iid ? 'Cambios guardados' : 'Ingreso guardado en '+soloMes(fecha.slice(0,7)));
    return;
  }
  let ok = true;
  if (!(monto>0)){ error('eMonto','Escribí un monto mayor a cero, por ejemplo 2500 o 2.500,50.'); ok=false; }
  if (!cat){ error('eCat','Elegí una categoría.'); ok=false; }
  if (cat==='__nueva' && !$('#fNueva').value.trim()){ error('eCat','Escribí el nombre de la nueva categoría.'); ok=false; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)){ error('eFecha','Elegí una fecha.'); ok=false; }
  if (!ok) return;
  const gid = form.dataset.id;
  await seguro(async () => {
    const catId = cat==='__nueva' ? await crearCat($('#fNueva').value) : cat;
    const prev = gid ? S.gastos[gid] : null;
    cerrarHoja();
    await db.guardarGasto(gid || nuevoId(), {monto, cat:catId, fecha, desc, creado:prev?.creado||Date.now()});
    if (!gid) festejar();   // solo en gastos nuevos, no al editar
    if (mesDe(fecha) !== S.mes){ S.mes=mesDe(fecha); S.on=-1; render(); }
  }, gid ? 'Cambios guardados' : 'Gasto guardado en '+soloMes(fecha.slice(0,7)));
}

/* =====================================================================
   8. CLICS Y FORMULARIOS: qué pasa cuando tocás cada cosa
   ===================================================================== */
document.addEventListener('click', async e => {
  if (e.target.id === 'velo'){ cerrarHoja(); return; }
  const tp = e.target.closest('[data-tipo]'); if (tp){ ponerTipo(tp.dataset.tipo); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a==='abrir'){ S.vista=id; S.on=-1; S.confirma=null; S.editaCat=false; render(); scrollTo(0,0); }
  else if (a==='volver'){ S.vista='inicio'; S.confirma=null; S.editaCat=false; render(); }
  else if (a==='cerrar') cerrarHoja();
  else if (a==='pestana'){ S.pestana=b.dataset.p; S.confirma=null; render(); }
  else if (a==='dia'){ S.diaSel=b.dataset.f; S.confirma=null; render(); }
  else if (a==='agregarDia') abrirHoja(null, b.dataset.f);
  else if (a==='colorC'){ const id=S.vista; await seguro(() => db.guardarCat(id, {...S.cats[id], color:Number(b.dataset.c)}), 'Color cambiado'); }
  else if (a==='sugerida') await seguro(() => crearCat(b.dataset.n));
  else if (a==='editarG') abrirHoja(id);
  else if (a==='editarI') abrirHoja(null, null, {ingreso:id});
  else if (a==='pedirBorrarI'){ S.confirma='i:'+id; render(); }
  else if (a==='borrarI'){ S.confirma=null; await seguro(() => db.borrarIngreso(id), 'Ingreso borrado'); }
  else if (a==='presu') abrirPresu();
  else if (a==='repetirG') repetirGasto(id);
  else if (a==='pedirBorrarG'){ S.confirma='g:'+id; render(); }
  else if (a==='pedirBorrarC'){ S.confirma='c:'+id; S.editaCat=false; render(); }
  else if (a==='no'){ S.confirma=null; S.editaCat=false; render(); }
  else if (a==='borrarG'){ S.confirma=null; await seguro(() => db.borrarGasto(id), 'Gasto borrado'); }
  else if (a==='borrarC'){ const nombre=S.cats[id].nombre; S.confirma=null; S.vista='inicio'; await seguro(() => db.borrarCat(id), 'Borraste '+nombre); }
  else if (a==='renombrarC'){ S.editaCat=true; S.confirma=null; render(); const i=$('#inRenombrar'); i.focus(); i.select(); }
});
document.addEventListener('submit', async e => {
  const f = e.target, t = f.dataset.f; if (!t) return;
  e.preventDefault();
  if (t==='gasto') guardarGasto(f);
  else if (t==='presu'){
    const m = parseMonto($('#pMonto').value);
    if (!(m >= 0)){ const e=$('#ePresu'); e.textContent='Escribí un monto, por ejemplo 500000 o 500.000.'; e.hidden=false; return; }
    cerrarHoja(); await seguro(() => db.guardarPresu(S.mes, m), 'Presupuesto guardado');
  }
  else if (t==='nuevaCat'){ const v=$('#inNuevaCat').value; if(!v.trim()) return; await seguro(() => crearCat(v), 'Categoría creada'); }
  else if (t==='renombrar'){ const v=$('#inRenombrar').value.trim().replace(/\s+/g,' '); if(!v) return; const id=S.vista;
    S.editaCat=false; await seguro(() => db.guardarCat(id, {...S.cats[id], nombre:v}), 'Nombre cambiado'); }
});
// Resaltar una porción de la torta al pasar el mouse
document.addEventListener('mouseover', e => { const el=e.target.closest('[data-i]'); const i=el?Number(el.dataset.i):-1;
  if (S.vista==='inicio' && el && i!==S.on && (el.closest('.dona')||el.classList.contains('fila'))){ S.on=i; actualizarDona(); } });
document.addEventListener('mouseout', e => { if (S.on>=0 && !e.relatedTarget?.closest?.('[data-i]')){ S.on=-1; actualizarDona(); } });
function actualizarDona(){ const d=document.querySelector('.dona'); if(!d) return; const {filas,total}=resumen(); d.outerHTML=dona(filas,total);
  document.querySelectorAll('.fila').forEach(f=>f.classList.toggle('on', Number(f.dataset.i)===S.on)); }
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#velo').hidden) cerrarHoja(); });
$('#mesAnt').onclick = () => { S.mes=moverMes(S.mes,-1); S.on=-1; S.confirma=null; render(); };
$('#mesSig').onclick = () => { S.mes=moverMes(S.mes,1); S.on=-1; S.confirma=null; render(); };
$('#btnAgregar').onclick = () => abrirHoja(null);
$('#buscar').addEventListener('input', e => { S.busca = e.target.value; S.confirma = null; render(); });

/* =====================================================================
   9. INICIAR SESIÓN Y CREAR CUENTA
   ===================================================================== */
const MENSAJES = {
  'Invalid login credentials': 'El email o la contraseña no coinciden.',
  'User already registered': 'Ya existe una cuenta con ese email. Tocá "Entrar con mi cuenta", acá abajo.',
  'Email not confirmed': 'Falta confirmar el email: revisá tu casilla y tocá el link que te llegó.'
};
let modoCrear = false;   // false = pantalla "Entrar", true = pantalla "Crear cuenta"
function errLogin(t){ const e=$('#lErr'); e.textContent=t; e.hidden=false; }
// Cambia la pantalla entre "Entrar" y "Crear cuenta"
function ponerModo(crear){
  modoCrear = crear;
  $('#lEntrar').textContent = crear ? 'Crear cuenta' : 'Entrar';
  $('#lPregunta').textContent = crear ? '¿Ya tenés cuenta?' : '¿No tenés cuenta?';
  $('#lCambiar').textContent = crear ? 'Entrar con mi cuenta' : 'Crear cuenta nueva';
  $('#lPass').placeholder = crear ? 'Mínimo 6 caracteres' : '';
  $('#lPass').autocomplete = crear ? 'new-password' : 'current-password';
  $('#lErr').hidden = true;
}
async function ingresar(){
  const crear = modoCrear;
  const email=$('#lEmail').value.trim(), password=$('#lPass').value;
  $('#lErr').hidden = true;
  if (!email || !password) return errLogin('Completá el email y la contraseña.');
  if (crear && password.length < 6) return errLogin('La contraseña tiene que tener al menos 6 caracteres.');
  $('#lEntrar').disabled = true;
  const { data, error } = crear ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  $('#lEntrar').disabled = false;
  if (error) return errLogin(MENSAJES[error.message] || error.message);
  if (crear && !data.session) errLogin('Te mandamos un email para confirmar la cuenta. Tocá el link y después entrá acá.');
}
$('#login').addEventListener('submit', e => { e.preventDefault(); ingresar(); });
$('#lCambiar').onclick = () => ponerModo(!modoCrear);
// Botón "Mostrar": cambia la contraseña entre puntitos y texto visible
$('#lVer').onclick = () => {
  const p = $('#lPass'); const ver = p.type === 'password';
  p.type = ver ? 'text' : 'password';
  $('#lVer').textContent = ver ? 'Ocultar' : 'Mostrar';
};
$('#btnSalir').onclick = () => sb.auth.signOut();

// Modo claro / oscuro: se aplica y se recuerda en este dispositivo
function aplicarTema(t){
  if (t === 'claro') document.documentElement.dataset.theme = 'light';
  else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;   // "auto": sigue al celular o la compu
  document.querySelectorAll('[data-tema]').forEach(b => b.classList.toggle('on', b.dataset.tema === t));
}
let temaGuardado = 'auto';
try { temaGuardado = localStorage.getItem('bolsillo-tema') || 'auto'; } catch(e){}
aplicarTema(temaGuardado);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tema]'); if (!b) return;
  try { localStorage.setItem('bolsillo-tema', b.dataset.tema); } catch(e){}
  aplicarTema(b.dataset.tema);
});

// Muestra la pantalla de ingreso o la app, según si hay una sesión iniciada
// La pantalla verde de bienvenida se va después de la animación (alrededor de un segundo y medio)
const inicioSplash = Date.now();
function sacarSplash(){
  const el = $('#splash'); if (!el || el.classList.contains('fuera')) return;
  const espera = matchMedia('(prefers-reduced-motion: reduce)').matches ? 600 : 1700;
  setTimeout(() => { el.classList.add('fuera'); setTimeout(() => el.remove(), 500); }, Math.max(0, espera - (Date.now() - inicioSplash)));
}
setTimeout(sacarSplash, 4000);   // por si la conexión tarda: que nunca quede trabada
function mostrar(sesion){
  sacarSplash();
  $('#login').hidden = !!sesion;
  $('#app').hidden = $('#pie').hidden = !sesion;
  if (sesion && !S.listo){ render(); db.cargar().catch(e => { console.error(e); $('#main').innerHTML='<div class="card"><p class="vacio">No se pudieron cargar tus gastos. Revisá tu conexión y recargá la página.</p></div>'; }); }
  if (!sesion){ S.listo=false; S.cats={}; S.gastos={}; S.ingresos={}; S.presu={}; S.vista='inicio'; }
}
// (el setTimeout evita un bloqueo conocido de Supabase si se hacen pedidos dentro de este aviso)
sb.auth.onAuthStateChange((_evento, sesion) => setTimeout(() => mostrar(sesion), 0));
</script>
